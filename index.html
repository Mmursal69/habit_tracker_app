<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header>
            <div class="logo-area">
                <h1>Routine<span>Pulse</span></h1>
                <p>Track your weekly disciplines</p>
            </div>
            
            <!-- Week Navigation Controls -->
            <div class="nav-controls">
                <button id="prev-week-btn" class="btn btn-secondary" aria-label="Previous week">← Prev</button>
                <button id="current-week-btn" class="btn btn-secondary" aria-label="Current week">Today's Week</button>
                <button id="next-week-btn" class="btn btn-secondary" aria-label="Next week">Next →</button>
                <span id="week-label" class="week-title">Loading week...</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <main>
            <!-- Control bar to add new habits -->
            <div class="action-bar">
                <form id="add-habit-form">
                    <input type="text" id="habit-input" placeholder="e.g., Read 30 mins, Exercise..." required maxlength="50" aria-label="New habit name">
                    <button type="submit" class="btn btn-primary">Add Habit</button>
                </form>
            </div>

            <!-- Context Container: Toggled via JavaScript -->
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">🌱</div>
                <h2>Your tracker is looking empty</h2>
                <p>Small daily actions lead to massive life changes. Type a habit above and hit add to start your streak.</p>
            </div>

            <div id="grid-container" class="grid-scroll-wrapper">
                <table id="habit-table">
                    <thead>
                        <tr id="table-header-row">
                            <!-- Headers generated dynamically by JS -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Habit rows generated dynamically by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
