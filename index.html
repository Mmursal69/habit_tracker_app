<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app_container">
        <header>
            <div class="logo_area">
                <h1>Habit<span> Maker</span></h1>
                <p>Track your weekly routines</p>
            </div>
            
            <div class="nav_controls">
                <button id="prev_week_btn" class="btn btn_secondary" aria-label="Previous week">Prev</button>
                <button id="current_week_btn" class="btn btn_secondary" aria-label="Current week">Today's Week</button>
                <button id="next_week_btn" class="btn btn_secondary" aria-label="Next week">Next</button>
                <span id="week_label" class="week_title">Loading week...</span>
            </div>
        </header>

        <main>
            <div class="action_bar">
                <form id="add_habit_form">
                    <input type="text" id="habit_input" placeholder="e.g., Reading, Going for a jog, swimming" required maxlength="50" aria-label="New habit name">
                    <button type="submit" class="btn btn_primary">Add Habit</button>
                </form>
            </div>
            <div id="empty_state" class="empty_state hidden">
                <div class="empty_icon">?</div>
                <h2>Your routines look very empty</h2>
                <p>Small daily actions lead to massive life changes. Type a habit above and start with a change.</p>
            </div>
            <div id="grid_container" class="grid_scroll_wrapper">
                <table id="habit_table">
                    <thead>
                        <tr id="table_header_row">
                        </tr>
                    </thead>
                    <tbody id="table_body">
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
